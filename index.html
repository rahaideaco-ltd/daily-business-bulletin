<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1A1A2E; /* Deep Dark Blue/Purple */
            --card-bg-color: #282A40; /* Slightly lighter dark blue/purple */
            --text-color: #E0E0E0; /* Off-white/Light Gray */
            --heading-color: #FFD700; /* Gold */
            --accent-color: #C0C0C0; /* Silver */
            --border-color: #4A4D6D; /* Muted purple */
            --shadow-color: rgba(0, 0, 0, 0.4);

            --cat-pricing: #FFD700; /* Gold */
            --cat-infrastructure: #87CEEB; /* Sky Blue */
            --cat-product-pivot: #3CB371; /* Medium Sea Green */
            --cat-ai-integration: #9370DB; /* Medium Purple */
            --cat-default: #708090; /* Slate Gray */
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--bg-color), #3A1C71); /* Dark gradient */
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        header h1 {
            color: var(--heading-color);
            font-size: 2.8em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            color: var(--accent-color);
            font-size: 1.2em;
            font-weight: 300;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .card {
            background-color: var(--card-bg-color);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 25px var(--shadow-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.8em;
            color: var(--heading-color);
            font-weight: 500;
        }

        .card-header span.date {
            font-size: 0.9em;
            color: var(--accent-color);
        }

        .category-tags {
            margin-top: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
            color: var(--bg-color); /* Dark text on colored background */
            background-color: var(--cat-default);
            white-space: nowrap;
        }
        .category-tag.cat-pricing { background-color: var(--cat-pricing); }
        .category-tag.cat-infrastructure { background-color: var(--cat-infrastructure); }
        .category-tag.cat-product-pivot { background-color: var(--cat-product-pivot); }
        .category-tag.cat-ai-integration { background-color: var(--cat-ai-integration); }

        .card h3 {
            color: var(--accent-color);
            font-size: 1.3em;
            margin-top: 25px;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        .card p {
            font-size: 0.95em;
            color: var(--text-color);
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .card ul {
            list-style: none;
            padding-right: 0;
            margin-bottom: 15px;
        }

        .card ul li {
            position: relative;
            padding-right: 25px;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .card ul li::before {
            content: '•';
            color: var(--heading-color);
            position: absolute;
            right: 0;
            font-size: 1.2em;
            line-height: 1;
        }

        .source-info {
            margin-top: 20px;
            font-size: 0.85em;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .source-info a {
            color: var(--cat-infrastructure); /* Use a category color for links */
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .source-info a:hover {
            color: var(--heading-color);
        }

        .stars {
            color: var(--heading-color);
            font-size: 1.2em;
            margin-left: 10px;
        }

        .core-lesson-section, .startup-action-section {
            background-color: #3B3E5C; /* Slightly different background for emphasis */
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
            border-left: 5px solid var(--cat-product-pivot); /* Green border */
        }

        .core-lesson-section h4, .startup-action-section h4 {
            color: var(--cat-product-pivot);
            font-size: 1.2em;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .core-lesson-section p, .startup-action-section p {
            font-size: 0.9em;
            color: var(--text-color);
            margin-bottom: 0;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 40px;
            color: var(--accent-color);
            font-size: 0.9em;
            border-top: 1px solid var(--border-color);
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }
            header p {
                font-size: 1em;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 20px;
            }
            .card-header h2 {
                font-size: 1.5em;
            }
            .card h3 {
                font-size: 1.1em;
            }
        }
    </style>
</head>

                "decision_outcome": "برنامه‌های پایلوت با چندین شرکت تحویل محلی، کاهش ۲۰ درصدی در هزینه‌های سوخت و ۱۵ درصدی در زمان تحویل را نشان دادند. مدل قیمت‌گذاری مبتنی بر عملکرد به سرعت پذیرفته شد زیرا ارزش را مستقیماً نشان می‌داد. UrbanFlow AI به سرعت در حال تبدیل شدن به یک راه‌حل ضروری برای لجستیک شهری است و نشان می‌دهد که چگونه یک استارتاپ می‌تواند با هوش مصنوعی تخصصی، یک مشکل عملیاتی بزرگ را حل کند و جریان‌های درآمدی جدیدی را باز کند.",

        function generateStars(count) {

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'card';

            const categories = item.category.split(', ').map(tag => {
                const className = categoryMap[tag] || 'cat-default';
                return `<span class="category-tag ${className}">${tag.replace(/-/g, ' ')}</span>`;
            }).join('');

            // Generalized "Why it matters" and "Action for your startup" based on core_lesson
            let whyItMatters = item.core_lesson;
            let actionForStartup = "";

            if (item.company === "OpenAI" && item.date === "2026-09-17") {
                whyItMatters = "این نشان می‌دهد که چگونه شرکت‌های اصلی هوش مصنوعی فراتر از ارائه مدل‌های خام، به سمت ساخت پلتفرم‌های سازمانی تمام‌عیار حرکت می‌کنند که چالش‌های پیچیده یکپارچه‌سازی، امنیت و حکمرانی را برای سازمان‌های بزرگ حل می‌کنند و جریان‌های درآمدی جدید و با ارزش بالا را باز می‌کنند. این روند بر تقاضا برای استقرار هوش مصنوعی 'کنترل‌شده' تأکید دارد.";

                whyItMatters = "این مورد قدرت استفاده از داده‌های اختصاصی پلتفرم را برای ایجاد خدمات هوش مصنوعی با ارزش افزوده برای کاربران 'سمت عرضه' نشان می‌دهد. با حل مشکلات اصلی عملیاتی و بهینه‌سازی درآمد آن‌ها، پلتفرم‌ها می‌توانند جریان‌های درآمدی جدید و با حاشیه سود بالا ایجاد کرده و وفاداری کاربر را به طور قابل توجهی افزایش دهند.";
                actionForStartup = "داده‌های پلتفرم خود را برای بینش‌هایی که می‌توانند 'تأمین‌کنندگان' یا 'تولیدکنندگان' شما را توانمند سازند، تجزیه و تحلیل کنید. ابزارهای مبتنی بر هوش مصنوعی را توسعه دهید که مستقیماً کارایی آن‌ها را افزایش دهد، هزینه‌های آن‌ها را کاهش دهد، یا درآمد آن‌ها را بالا ببرد. قیمت‌گذاری مبتنی بر عملکرد را برای همسویی انگیزه‌های شما با موفقیت آن‌ها در نظر بگیرید.";

                    <span class="date">تاریخ: ${item.date}</span>

                    <h4>اقدام امروز برای استارتاپ شما</h4>
                    <p>${actionForStartup}</p>
                </div>

                <div class="source-info">
                    <span>منبع: ${item.source_name}</span>

                    <span class="stars">کیفیت منبع: ${generateStars(item.source_quality_stars)}</span>
