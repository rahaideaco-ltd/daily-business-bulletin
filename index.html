            // Add more specific mappings if needed for common tags
        };

        function getStarRating(stars) {
            let starHtml = '';
            for (let i = 0; i < 5; i++) {
                starHtml += `<span class="${i < stars ? 'filled' : 'empty'}">★</span>`;
            }
            return starHtml;
        }

        function createCard(data) {
            const card = document.createElement('div');
            card.classList.add('card');

            const categories = data.category.split(', ').map(tag => `<span class="category-tag ${tagColors[tag] || ''}">${tag}</span>`).join('');

            const coreLessonWhyItMatters = `
                <div class="card-section">
                    <h3>چرا اهمیت دارد؟ (درس آموخته اصلی)</h3>
                    <p>${data.core_lesson}</p>
                </div>
            `;
            
            const startupAction = `
                <div class="card-section">
                    <h3>اقدام امروز برای استارتاپ شما</h3>
                    <p><strong>${data.core_lesson.split('. ')[0].replace('برای پذیرش گسترده LLM در سازمان‌ها، امنیت داده، حاکمیت و قابلیت اطمینان دامنه-ویژه حیاتی هستند. ارائه‌دهندگان هوش مصنوعی باید گزینه‌های استقرار هیبریدی/حاکمیتی و ابزارهای کاهش hallucination را برای بازارهای سازمانی فراهم کنند.', 'بر امنیت داده، حکمرانی و قابل اعتماد بودن در LLM های سازمانی تمرکز کنید.').replace('پلتفرم‌های تجارت الکترونیک می‌توانند با ارائه خدمات حیاتی و سازمانی‌مانند، از جمله حفاظت از برند مبتنی بر هوش مصنوعی، ارزش پیشنهادی خود را برای SMBها افزایش دهند و داده‌های پلتفرم را به جریان درآمدی با حاشیه سود بالا تبدیل کنند.', 'خدمات سازمانی و حیاتی مبتنی بر هوش مصنوعی (مانند حفاظت از برند) را به SMBها ارائه دهید و داده‌های پلتفرم را پول‌سازی کنید.').replace('شرکت‌های بزرگ فناوری با R&D عمیق در حوزه‌های نوظهور مانند متاورس و هوش مصنوعی مولد می‌توانند این قابلیت‌ها را به راه‌حل‌های SaaS B2B با ارزش بالا محصول‌سازی کنند که نیازهای حیاتی سازمانی را برطرف می‌کنند، به ویژه جایی که واقع‌گرایی و مقیاس‌پذیری کلیدی است. بهره‌گیری از سخت‌افزار سفارشی و استراتژی‌های ابری هیبریدی برای عملکرد و حساسیت داده بسیار مهم است.', 'تحقیق و توسعه در فناوری‌های نوظهور (متاورس، هوش مصنوعی مولد) را به SaaS B2B با سخت‌افزار سفارشی و ابر هیبریدی تبدیل کنید.').replace('پلتفرم‌هایی با داده‌های اختصاصی گسترده می‌توانند قابلیت‌های هوش مصنوعی داخلی خود را به پیشنهادات SaaS B2B2C پریمیوم برای کاربران \"سمت عرضه\" (یا حرفه‌ای) خود محصول‌سازی کنند. تمرکز بر نقاط درد کلیدی مانند قیمت‌گذاری پویا و انطباق، و بهره‌گیری از داده‌های بلادرنگ با هوش مصنوعی لبه، ارزش قابل توجه و جریان‌های درآمدی جدیدی را ایجاد می‌کند، به ویژه زمانی که به عملکرد گره خورده باشد.', 'قابلیت‌های هوش مصنوعی خود را به SaaS پریمیوم B2B2C برای کاربران حرفه‌ای خود تبدیل کنید، بر قیمت‌گذاری پویا، انطباق و هوش مصنوعی لبه تمرکز کنید.').replace('استارتاپ‌ها می‌توانند فرصت‌های قابل توجهی را با اعمال هوش مصنوعی تخصصی در مشکلات بهینه‌سازی پیچیده و چندوجهی (مانند لجستیک پایدار) که داده‌های بلادرنگ (IoT، هوش مصنوعی لبه) را با تحلیل‌های پیش‌بینانه و چندوجهی قدرتمند ترکیب می‌کنند، پیدا کنند. گره زدن قیمت‌گذاری به عملکرد قابل تأیید و تمرکز بر کاهش هزینه و پایداری، یک پیشنهاد ارزشی جذاب برای مشتریان سازمانی ایجاد کرده و پذیرش بازار را تسریع می‌کند.', 'هوش مصنوعی تخصصی (IoT، لبه) را برای حل مشکلات بهینه‌سازی پیچیده و چندوجهی (مانند لجستیک پایدار) به کار بگیرید و قیمت‌گذاری را به عملکرد گره بزنید.').replace('شرکت‌های رسانه‌ای با داده‌های اختصاصی گسترده و تخصص هوش مصنوعی می‌توانند قابلیت‌های داخلی خود را به راه‌حل‌های SaaS B2B با ارزش بالا برای بهینه‌سازی توزیع محتوا، شخصی‌سازی و درآمدزایی از تبلیغات تعاملی در اکوسیستم رسانه‌ای گسترده‌تر تبدیل کنند. سرمایه‌گذاری در سخت‌افزار سفارشی و هوش مصنوعی لبه برای عملکرد مقیاس‌پذیر و بلادرنگ حیاتی است.', 'از تخصص هوش مصنوعی و داده‌های اختصاصی خود برای توسعه SaaS B2B جهت بهینه‌سازی توزیع محتوا و تبلیغات تعاملی استفاده کنید؛ روی سخت‌افزار سفارشی و هوش مصنوعی لبه سرمایه‌گذاری کنید.')
                .replace('پلتفرم‌های پرداخت با داده‌های اختصاصی گسترده و تخصص هوش مصنوعی می‌توانند به راه‌حل‌های SaaS B2B پریمیوم برای چالش‌های پرداخت سازمانی، اتوماسیون و انطباق تغییر مسیر دهند. ارائه گزینه‌های ابری خصوصی/چند ابری برای امنیت و حریم خصوصی داده‌های شرکت‌های بزرگ حیاتی است.', 'از هوش مصنوعی و زیرساخت پرداخت خود برای ساخت SaaS B2B پریمیوم جهت اتوماسیون پرداخت، انطباق و مبارزه با تقلب برای شرکت‌ها بهره ببرید؛ گزینه‌های ابری خصوصی/چند ابری را ارائه دهید.')
                .replace('استارتاپ‌ها می‌توانند فرصت‌های قابل توجهی را با اعمال هوش مصنوعی چندوجهی، بلادرنگ و لبه‌ای برای مشکلات بهینه‌سازی پیچیده شهری (مانند لجستیک آخرین مایل پایدار) پیدا کنند. گره زدن قیمت‌گذاری به معیارهای عملکرد قابل تأیید (زمان، انتشار) و هدف قرار دادن بازارهای B2B/B2G، یک پیشنهاد ارزشی جذاب ایجاد می‌کند.', 'هوش مصنوعی چندوجهی، بلادرنگ و لبه‌ای را برای بهینه‌سازی لجستیک شهری (به خصوص آخرین مایل پایدار) به کار بگیرید و مدل‌های قیمت‌گذاری مبتنی بر عملکرد برای بازارهای B2B/B2G را در نظر بگیرید.')
                .trim()}</strong></p>
                </div>
            `;


            card.innerHTML = `
                <div class="card-header">
                    <h2>${data.company}</h2>
                    <div class="category-tags">${categories}</div>
                </div>
                <div class="card-content">
                    <div class="card-section">
                        <h3>مشکل</h3>
                        <p>${data.problem}</p>
                    </div>
                    <div class="card-section">
                        <h3>فرضیه</h3>
                        <p>${data.hypothesis}</p>
                    </div>
                    <div class="card-section">
                        <h3>اقدام عملی / آزمایش</h3>
                        <p>${data.experiment_or_action}</p>
                    </div>
                    <div class="card-section">
                        <h3>متریک پیگیری‌شده</h3>
                        <p>${data.metric_tracked}</p>
                    </div>
                    <div class="card-section">
                        <h3>نتیجه تصمیم</h3>
                        <p>${data.decision_outcome}</p>
                    </div>
                    ${coreLessonWhyItMatters}
                    ${startupAction}
                </div>
                <div class="source-info">
                    <span>منبع: <a href="${data.source_url}" target="_blank">${data.source_name}</a></span>
                    <span class="star-rating">${getStarRating(data.source_quality_stars)}</span>
                </div>
            `;
            return card;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const cardsGrid = document.getElementById('cards-grid');
            cardData.forEach(data => {
                cardsGrid.appendChild(createCard(data));
            });
        });
    </script>
</body>
</html>
