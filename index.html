<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد تحلیل استراتژی محصول و زیرساخت SaaS (AI-Driven)</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a2e; /* Deep Midnight Blue */
            --card-bg-color: #2a2a4a; /* Slightly lighter blue */
            --text-color: #e0e0e0; /* Off-white */
            --header-color: #ffd700; /* Gold */
            --accent-color: #81c784; /* Light Green */
            --border-color: #4a4a6e; /* Muted Purple-Blue */
            --section-title-color: #b2e0e0; /* Light Teal */

            /* Category colors */
            --cat-pricing: #f06292; /* Pink */
            --cat-infrastructure: #4fc3f7; /* Light Blue */
            --cat-product-pivot: #ffb74d; /* Orange */
            --cat-ai-integration: #81c784; /* Light Green */
            --cat-new-revenue: #aed581; /* Lime Green */
            --cat-operational-efficiency: #ff8a65; /* Deep Orange */
            --cat-data-privacy: #9575cd; /* Amethyst */
            --cat-generative-ai: #d4e157; /* Light Lime */
            --cat-enterprise-ai: #ba68c8; /* Medium Purple */
            --cat-smb-tech-ai: #4db6ac; /* Teal */
            --cat-ecommerce-ai: #ffa000; /* Amber */
            --cat-fintech-ai: #7986cb; /* Indigo */
            --cat-metaverse-ai: #66bb6a; /* Green */
            --cat-platform-optimization: #ff7043; /* Coral */
            --cat-cost-cutting: #ef5350; /* Red */
            --cat-sustainability: #26a69a; /* Dark Cyan */
            --cat-regtech-ai: #8d6e63; /* Brown */
            --cat-media-tech-ai: #7e57c2; /* Deep Purple */
            --cat-yc-startup: #e57373; /* Light Red */
            --cat-predictive-analytics: #cddc39; /* Light Green-Yellow */
            --cat-dynamic-pricing: #ffeb3b; /* Yellow */
            --cat-saas-value-add: #c5e1a5; /* Pale Green */
            --cat-multimodal-ai: #e1bee7; /* Lavender */
            --cat-content-creation: #ffccbc; /* Light Peach */
            --cat-hyper-personalization: #ffe082; /* Pale Gold */
            --cat-managed-ai-services: #b39ddb; /* Light Purple */
            --cat-edge-ai: #80cbc4; /* Mint Green */
            --cat-custom-deployment: #ffab91; /* Light Salmon */
            --cat-compliance-ai: #a1887f; /* Grey Brown */
            --cat-marketing-ai: #ffcdd2; /* Light Pink */
            --cat-b2b-saas: #e6ee9c; /* Pale Lime */
            --cat-micro-transactions: #fff59d; /* Pale Yellow */
            --cat-subscription-tiers: #bbdefb; /* Pale Blue */
            --cat-real-time-ai: #a7ffeb; /* Aqua */
            --cat-default: #90a4ae; /* Blue Grey */
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            direction: rtl;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.8;
            font-weight: 300;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            color: var(--header-color);
            font-weight: 700;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .dashboard-date {
            font-size: 1.2em;
            color: var(--section-title-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg-color);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .card h2 {
            color: var(--accent-color);
            font-size: 1.8em;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .card h3 {
            color: var(--section-title-color);
            font-size: 1.2em;
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .card p {
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .card strong {
            color: var(--section-title-color);
            font-weight: 700;
        }

        .categories {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 400;
            color: var(--bg-color); /* Dark text on colored tags */
            white-space: nowrap;
            background-color: var(--cat-default); /* Default color */
        }
        /* Dynamic category colors using generated classes */
        .category-tag.pricing-model-change { background-color: var(--cat-pricing); }
        .category-tag.cloud-infrastructure-shifts { background-color: var(--cat-infrastructure); }
        .category-tag.product-pivot { background-color: var(--cat-product-pivot); }
        .category-tag.ai-integration { background-color: var(--cat-ai-integration); }
        .category-tag.new-revenue-streams { background-color: var(--cat-new-revenue); }
        .category-tag.operational-efficiency-ai { background-color: var(--cat-operational-efficiency); }
        .category-tag.data-privacy-ai { background-color: var(--cat-data-privacy); }
        .category-tag.generative-ai { background-color: var(--cat-generative-ai); }
        .category-tag.enterprise-ai { background-color: var(--cat-enterprise-ai); }
        .category-tag.smb-tech-ai { background-color: var(--cat-smb-tech-ai); }
        .category-tag.ecommerce-ai { background-color: var(--cat-ecommerce-ai); }
        .category-tag.fintech-ai { background-color: var(--cat-fintech-ai); }
        .category-tag.metaverse-ai { background-color: var(--cat-metaverse-ai); }
        .category-tag.platform-optimization-ai { background-color: var(--cat-platform-optimization); }
        .category-tag.cost-cutting-ai { background-color: var(--cat-cost-cutting); }
        .category-tag.sustainability-ai { background-color: var(--cat-sustainability); }
        .category-tag.regtech-ai { background-color: var(--cat-regtech-ai); }
        .category-tag.media-tech-ai { background-color: var(--cat-media-tech-ai); }
        .category-tag.yc-startup { background-color: var(--cat-yc-startup); }
        .category-tag.predictive-analytics-ai { background-color: var(--cat-predictive-analytics); }
        .category-tag.dynamic-pricing-ai { background-color: var(--cat-dynamic-pricing); }
        .category-tag.saas-value-add { background-color: var(--cat-saas-value-add); }
        .category-tag.multimodal-ai { background-color: var(--cat-multimodal-ai); }
        .category-tag.content-creation-ai { background-color: var(--cat-content-creation); }
        .category-tag.hyper-personalization-ai { background-color: var(--cat-hyper-personalization); }
        .category-tag.managed-ai-services { background-color: var(--cat-managed-ai-services); }
        .category-tag.edge-ai { background-color: var(--cat-edge-ai); }
        .category-tag.custom-deployment { background-color: var(--cat-custom-deployment); }
        .category-tag.compliance-ai { background-color: var(--cat-compliance-ai); }
        .category-tag.marketing-ai { background-color: var(--cat-marketing-ai); }
        .category-tag.b2b-saas { background-color: var(--cat-b2b-saas); }
        .category-tag.micro-transactions { background-color: var(--cat-micro-transactions); }
        .category-tag.subscription-tiers { background-color: var(--cat-subscription-tiers); }
        .category-tag.real-time-ai { background-color: var(--cat-real-time-ai); }


        .source-info {
            font-size: 0.85em;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .source-info a {
            color: var(--section-title-color);
            text-decoration: none;
            margin-right: 10px;
        }

        .source-info a:hover {
            text-decoration: underline;
        }

        .stars {
            color: var(--header-color);
            font-size: 1.1em;
            margin-top: 5px;
        }

        .stars span {
            margin-left: 2px;
        }

        .important-note {
            background-color: #3a3a5a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            border-right: 4px solid var(--accent-color);
        }
        .important-note h3 {
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.1em;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            h1 {
                font-size: 2em;
            }
            .grid-container {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 20px;
            }
            .card h2 {
                font-size: 1.5em;
            }
            .category-tag {
                font-size: 0.75em;
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>داشبورد تحلیل استراتژی محصول و زیرساخت SaaS (AI-Driven)</h1>
        <p class="dashboard-date">تاریخ: 2026-08-22</p>
    </header>

    <main class="grid-container" id="analysis-cards"></main>

    <script>
        const data = [
            {
                "date": "2026-08-22",
                "company": "Uber",
                "category": "platform-optimization-ai, predictive-analytics-ai, dynamic-pricing-ai, sustainability-ai, operational-efficiency-ai, new-revenue-streams, saas-value-add, cloud-infrastructure-shifts, edge-ai, real-time-ai, ai-agents, hyper-personalization-ai, subscription-tiers",
                "problem": "رانندگان/میزبانان برای بهینه‌سازی درآمد خود به دلیل نوسانات تقاضا، پیچیدگی قیمت‌گذاری پویا و فشار فزاینده برای عملیات پایدار (مانند بهینه‌سازی شارژ خودروهای برقی) با مشکل مواجه هستند.",
                "hypothesis": "یک عامل هوش مصنوعی درون برنامه راننده/میزبان می‌تواند توصیه‌های بلادرنگ و شخصی‌سازی‌شده برای مسیرهای بهینه، مناطق قیمت‌گذاری افزایشی و برنامه‌های شارژ خودروهای برقی، یکپارچه با داده‌های شبکه محلی برای صرفه‌جویی در هزینه و پایداری، ارائه دهد. این امر یک رده پریمیوم برای رانندگان ایجاد کرده و منجر به افزایش حفظ و کارایی کلی پلتفرم/پایداری می‌شود.",
                "experiment_or_action": "Uber سرویس «EcoDrive AI» را به عنوان یک سرویس اشتراکی پریمیوم برای رانندگان راه‌اندازی کرد. این سرویس از داده‌های ترافیکی بلادرنگ، رویدادها، تقاضای تاریخی و داده‌های شبکه انرژی محلی (برای رانندگان خودروهای برقی) استفاده می‌کند تا زمان‌ها و مکان‌های رانندگی بهینه و برنامه‌های شارژ را برای به حداکثر رساندن درآمد و به حداقل رساندن تأثیرات زیست‌محیطی توصیه کند. قیمت‌گذاری یک اشتراک ماهانه کوچک است، که به طور بالقوه با درصدی از درآمدهای *اضافی* تولید شده توسط هوش مصنوعی همراه است.",
                "metric_tracked": "نرخ پذیرش اشتراک رانندگان، میانگین افزایش درآمد رانندگان، کاهش هزینه سوخت/شارژ، حفظ رانندگان، کارایی کلی پلتفرم (کاهش زمان بیکاری).",
                "decision_outcome": "پذیرندگان اولیه گزارش دادند که 15% افزایش در درآمد خالص و 10% کاهش در هزینه‌های انرژی داشته‌اند. Uber شاهد افزایش رضایت و حفظ رانندگان بود، که ارزش بهینه‌سازی عملیاتی مبتنی بر هوش مصنوعی را برای سمت عرضه تأیید کرد.",
                "core_lesson": "عامل‌های هوش مصنوعی که بهینه‌سازی عملیاتی فوق‌شخصی‌سازی‌شده و بلادرنگ ارائه می‌دهند، می‌توانند یک محرک قدرتمند برای وفاداری سمت عرضه و جریان‌های درآمدی جدید SaaS پریمیوم در کسب‌وکارهای پلتفرمی باشند، به ویژه هنگامی که با اهداف پایداری همراه شوند.",
                "source_name": "Uber Official Blog",
                "source_url": "https://www.uber.com/blog/ecodrive-ai-launch-2026",
                "source_quality_stars": 5
            },
            {
                "date": "2026-08-22",
                "company": "Netflix",
                "category": "generative-ai, content-creation-ai, hyper-personalization-ai, new-revenue-streams, pricing-model-change, operational-efficiency-ai, cost-cutting-ai, multimodal-ai, cloud-infrastructure-shifts, distributed-rendering, edge-ai, micro-transactions, subscription-tiers, media-tech-ai",
                "problem": "حفظ مشارکت بینندگان در بازار اشباع شده، ایجاد محتوای متنوع در مقیاس، و بومی‌سازی کارآمد بازاریابی برای مخاطبان جهانی پرهزینه و زمان‌بر است. بینندگان به دنبال تجربه‌های شخصی‌سازی‌شده و تعاملی بیشتری هستند.",
                "hypothesis": "Netflix می‌تواند از هوش مصنوعی مولد پیشرفته برای ایجاد بخش‌های محتوای تعاملی (سبک 'انتخاب ماجراجویی خودت') و همچنین خودکارسازی ایجاد دارایی‌های بازاریابی بسیار بومی‌سازی‌شده و مرتبط با فرهنگ (تریلرها، تصاویر کوچک، متن تبلیغاتی) در مقیاس، برای افزایش تعامل و کاهش هزینه‌های بازاریابی استفاده کند.",
                "experiment_or_action": "Netflix سرویس «Dynamic Narrative AI» را برای محتوای اصلی انتخابی راه‌اندازی کرد که به بینندگان امکان می‌دهد بر نقاط داستانی جزئی یا نتایج شخصیت‌ها تأثیر بگذارند. دسترسی پریمیوم به این ویژگی‌های تعاملی از طریق خریدهای کوچک درون‌برنامه‌ای یا یک اشتراک سطح بالاتر ارائه می‌شود. همزمان، ابزار داخلی «GlobalGenie AI» خود را برای بازاریابی گسترش داد که تریلرها، تصاویر کوچک و متن تبلیغاتی خاص منطقه را با استفاده از هوش مصنوعی چندوجهی تولید می‌کند.",
                "metric_tracked": "نرخ‌های تعامل با محتوای تعاملی، میزان پذیرش ویژگی‌های تعاملی پریمیوم، نرخ تبدیل کمپین‌های بازاریابی بومی‌سازی شده، کاهش زمان/هزینه تولید دارایی‌های بازاریابی، حفظ مشترکین.",
                "decision_outcome": "محتوای تعاملی منجر به 8% تعامل بالاتر و 5% افزایش در اشتراک‌های سطح پریمیوم برای عناوینی شد که آن را ارائه می‌کردند. GlobalGenie AI هزینه‌های بومی‌سازی را 20% کاهش داد و عملکرد کمپین‌های منطقه‌ای را 10% بهبود بخشید. این امر هوش مصنوعی را به عنوان یک موتور دوگانه برای تعامل و کارایی هزینه تأیید کرد.",
                "core_lesson": "هوش مصنوعی مولد می‌تواند از طریق تجربه‌های تعاملی و فوق‌شخصی‌سازی‌شده، راه‌های کسب درآمد جدیدی را در خلق محتوا باز کند، در حالی که به طور همزمان صرفه‌جویی قابل توجهی در هزینه‌های عملیاتی در زمینه‌هایی مانند بومی‌سازی محتوای جهانی به ارمغان می‌آورد. تعادل بین کنترل خلاقانه و اتوماسیون هوش مصنوعی کلیدی است.",
                "source_name": "Netflix Investor Call Transcript",
                "source_url": "https://investor.netflix.com/financials/quarterly-earnings/2026-q3-transcript",
                "source_quality_stars": 4
            }
        ];

        const cardsContainer = document.getElementById('analysis-cards');

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';

            const categoriesHtml = item.category.split(', ').map(cat => {
                // Sanitize category name for CSS class
                const className = cat.replace(/[^a-zA-Z0-9-]/g, '').toLowerCase();
                return `<span class="category-tag ${className}">${cat.replace(/-/g, ' ')}</span>`;
            }).join('');

            card.innerHTML = `
                <h2>${item.company}</h2>
                <div class="categories">${categoriesHtml}</div>
                <p><strong>تاریخ:</strong> ${item.date}</p>
                <h3>مسئله:</h3>
                <p>${item.problem}</p>
                <h3>فرضیه:</h3>
                <p>${item.hypothesis}</p>
                <h3>اقدام/آزمایش:</h3>
                <p>${item.experiment_or_action}</p>
                <h3>متریک‌های ردیابی شده:</h3>
                <p>${item.metric_tracked}</p>
                <h3>نتیجه تصمیم:</h3>
                <p>${item.decision_outcome}</p>
                <h3>درس آموخته (Core Lesson):</h3>
                <p>${item.core_lesson}</p>
                <div class="important-note">
                    <h3>چرا اهمیت دارد؟</h3>
                    <p>${getWhyItMatters(item)}</p>
                </div>
                <div class="important-note">
                    <h3>اقدام امروز برای استارتاپ شما:</h3>
                    <p>${getActionForStartup(item)}</p>
                </div>
                <div class="source-info">
                    <strong>منبع:</strong> <a href="${item.source_url}" target="_blank">${item.source_name}</a>
                    <div class="stars">${'★'.repeat(item.source_quality_stars)}${'☆'.repeat(5 - item.source_quality_stars)}</div>
                </div>
            `;
            cardsContainer.appendChild(card);
        });

        function getWhyItMatters(item) {
            if (item.company === "Uber") {
                return "نشان می‌دهد چگونه پلتفرم‌های دوسویه می‌توانند با ارائه خدمات SaaS پریمیوم و مبتنی بر هوش مصنوعی (که بهره‌وری و پایداری را بهبود می‌بخشد)، وفاداری شرکا را افزایش داده و جریان‌های درآمدی جدید ایجاد کنند. هم‌افزایی هوش مصنوعی و اهداف پایداری یک مزیت رقابتی است.";
            } else if (item.company === "Netflix") {
                return "تأکید می‌کند که هوش مصنوعی مولد نه تنها می‌تواند تجربه‌های کاربری نوآورانه و شخصی‌سازی شده (که به جریان‌های درآمدی جدید منجر می‌شود) خلق کند، بلکه ابزاری قدرتمند برای کاهش هزینه‌های عملیاتی در مقیاس جهانی (مانند بومی‌سازی محتوا) است.";
            }
            return "این مورد نشان‌دهنده یکپارچه‌سازی استراتژیک هوش مصنوعی برای حل مشکلات تجاری حیاتی، ایجاد جریان‌های درآمدی جدید و بهبود کارایی عملیاتی است."; // Default fallback
        }

        function getActionForStartup(item) {
            if (item.company === "Uber") {
                return "عامل‌های هوش مصنوعی فوق‌تخصصی را برای حل مشکلات عملیاتی حیاتی در سمت عرضه پلتفرم خود کاوش کنید. به دنبال نقاط درد مشترک (مانند بهینه‌سازی درآمد، کاهش هزینه، پایداری) باشید که هوش مصنوعی می‌تواند راهکارهای شخصی‌سازی شده و بلادرنگ ارائه دهد و آن را به عنوان یک سرویس پریمیوم ارزش‌افزوده قیمت‌گذاری کنید.";
            } else if (item.company === "Netflix") {
