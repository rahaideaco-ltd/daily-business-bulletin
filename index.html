            const genericCategory = categoryColorMap[tag] || "general";

                case "infrastructure": return "tag-infrastructure";
                case "product-pivot": return "tag-product-pivot";

        function createStarRating(count) {
            return '<span class="star-rating">' + '★'.repeat(count) + '</span>';

        function renderCard(item) {
            const card = document.createElement('div');
            card.className = 'card';

            const whyItMatters = `
                <div class="card-section-title">چرا اهمیت دارد؟</div>
                <p>${item.decision_outcome}</p>

            `;

            const categories = item.category.split(', ').map(tag => `<span class="category-tag ${getCategoryClass(tag)}">${tag.replace(/-/g, ' ')}</span>`).join('');

                    <div class="date">${item.date}</div>

        // Sort data by date in descending order
        data.sort((a, b) => new Date(b.date) - new Date(a.date));

        const today = "2026-10-11";
        data.forEach(item => {
            if (item.date === today) {

                historicalSignalsContainer.appendChild(renderCard(item));
