        function createStarRating(quality) {
            let stars = '';
            for (let i = 0; i < 5; i++) {
                stars += `<span class="${i < quality ? 'star-filled' : 'star-empty'}"></span>`;
            }
            return `<div class="source-quality">${stars}</div>`;
        }

        function createTagElements(categoryString) {
            const categories = categoryString.split(',').map(tag => tag.trim());
            return categories.map(tag => `<span class="tag" data-category="${tag}">${tag}</span>`).join('');
        }

        const dashboardGrid = document.getElementById('dashboard-grid');

        records.forEach(record => {
            const card = document.createElement('div');
            card.className = 'card';

            card.innerHTML = `
                <div class="card-header">
                    <div class="company-info">
                        <div class="company-name">${record.company}</div>
                        <div class="card-date">تاریخ: ${record.date}</div>

                </div>

            dashboardGrid.appendChild(card);
