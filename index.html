        records.forEach(record => {
            const card = document.createElement('div');
            card.className = 'company-card';

            const categories = record.category.split(', ').map(cat => {
                let displayCat = cat.replace(/-/g, ' '); // Replace hyphens for better display
                // Map to Farsi display names for better readability
                switch (cat) {
                    case 'enterprise-ai': displayCat = 'هوش مصنوعی سازمانی'; break;
                    case 'data-privacy-ai': displayCat = 'حریم خصوصی داده و هوش مصنوعی'; break;
                    case 'sovereign-ai': displayCat = 'هوش مصنوعی حاکمیتی'; break;
                    case 'new-revenue-streams': displayCat = 'جریان‌های درآمدی جدید'; break;
                    case 'pricing-model-change': displayCat = 'تغییر مدل قیمت‌گذاری'; break;
                    case 'cloud-infrastructure-shifts': displayCat = 'تغییر زیرساخت ابری'; break;
                    case 'managed-ai-services': displayCat = 'خدمات مدیریت‌شده هوش مصنوعی'; break;
                    case 'custom-deployment': displayCat = 'استقرار سفارشی'; break;
                    case 'compliance-ai': displayCat = 'انطباق و هوش مصنوعی'; break;
                    case 'ai-agents': displayCat = 'عوامل هوش مصنوعی'; break;
                    case 'operational-efficiency-ai': displayCat = 'بهره‌وری عملیاتی با هوش مصنوعی'; break;
                    case 'saas-value-add': displayCat = 'سرویس ارزش افزوده SaaS'; break;
                    case 'hyper-personalization-ai': displayCat = 'شخصی‌سازی فوق‌العاده با هوش مصنوعی'; break;
                    case 'predictive-analytics-ai': displayCat = 'تحلیل پیش‌بینانه با هوش مصنوعی'; break;
                    case 'platform-optimization': displayCat = 'بهینه‌سازی پلتفرم'; break;
                    case 'b2b2c-model': displayCat = 'مدل B2B2C'; break;
                    case 'generative-ai': displayCat = 'هوش مصنوعی مولد'; break;
                    case 'multimodal-ai': displayCat = 'هوش مصنوعی چندوجهی'; break;
                    case 'content-creation-ai': displayCat = 'تولید محتوا با هوش مصنوعی'; break;
                    case 'smb-tech-ai': displayCat = 'هوش مصنوعی برای کسب‌وکارهای کوچک و متوسط'; break;
                    case 'freemium-model': displayCat = 'مدل فریمیوم'; break;
                    case 'marketing-ai': displayCat = 'هوش مصنوعی بازاریابی'; break;
                    case 'developer-platform': displayCat = 'پلتفرم توسعه‌دهنده'; break;
                    default: displayCat = displayCat; // Keep original if no specific mapping
                }
                return `<span class="category-tag" data-cat="${cat}">${displayCat}</span>`;
            }).join('');

            const stars = Array(record.source_quality_stars).fill('<i class="fas fa-star"></i>').join('');

            card.innerHTML = `
                <div class="company-header">
                    <h2>${record.company}</h2>
                    <div class="date">${record.date}</div>
                </div>
                <div class="category-tags">${categories}</div>

                <h3 class="section-title">مسئله</h3>
                <p>${record.problem}</p>

                <h3 class="section-title">فرضیه</h3>
                <p>${record.hypothesis}</p>

                <h3 class="section-title">اقدام / آزمایش</h3>
                <p>${record.experiment_or_action}</p>

                <h3 class="section-title">تصمیم / نتیجه</h3>
                <p>${record.decision_outcome}</p>

                <h3 class="section-title">چرا اهمیت دارد؟</h3>
                <p>${record.core_lesson}</p>

                <h3 class="section-title">اقدام امروز برای استارتاپ شما</h3>
                <p>${record.core_lesson.split('. ').map(s => s.trim() + '.').join('<br/>')}</p> <!-- Simple split for actionable advice -->

                <div class="source-info">
                    <span>منبع: <a href="${record.source_url}" target="_blank">${record.source_name}</a></span>
                    <span class="source-stars">کیفیت منبع: ${stars}</span>
                </div>
            `;
            dashboardContainer.appendChild(card);
        });
    </script>
</body>
</html>
