            return categoryColors[primaryCategory] || 'default-tag';
        }

        signals.forEach(signal => {
            const card = document.createElement('div');
            card.classList.add('card');

            const categories = signal.category.split(',').map(cat => `<span class="tag ${getCategoryClass(cat.trim())}">${cat.trim()}</span>`).join('');
            const stars = '★'.repeat(signal.source_quality_stars) + '☆'.repeat(5 - signal.source_quality_stars);

            card.innerHTML = `
                <div class="card-header">
                    <div class="date">${signal.date}</div>
                    <h2>${signal.company}</h2>
                    <div class="tags">${categories}</div>
                </div>
                <div class="card-content">
                    <h3>مسئله:</h3>
                    <p>${signal.problem}</p>
                    <h3>فرضیه:</h3>
                    <p>${signal.hypothesis}</p>
                    <h3>اقدام/آزمایش:</h3>
                    <p>${signal.experiment_or_action}</p>
                    <h3>متریک ردیابی‌شده:</h3>
                    <p>${signal.metric_tracked}</p>
                    <h3>نتیجه تصمیم:</h3>
                    <p>${signal.decision_outcome}</p>
                    <div class="core-lesson-section">
                        <h3>درس‌آموخته اصلی:</h3>
                        <p>${signal.core_lesson}</p>
                    </div>
                    <div class="why-it-matters-section">
                        <h3>چرا اهمیت دارد؟</h3>
                        <p>${generateWhyItMatters(signal)}</p>
                    </div>
                    <div class="action-for-startup-section">
                        <h3>اقدام امروز برای استارتاپ شما:</h3>
                        <p>${generateActionForStartup(signal)}</p>
                    </div>
                </div>
                <div class="source-info">
                    <span>منبع: <a href="${signal.source_url}" target="_blank">${signal.source_name}</a></span>
                    <span class="star-rating" title="کیفیت منبع">${stars}</span>
                </div>
            `;
            dashboardContainer.appendChild(card);
        });

        function generateWhyItMatters(signal) {
            if (signal.company === "OpenAI") {
                return "این سیگنال نشان می‌دهد که بازار برای راه‌حل‌های هوش مصنوعی سازمانی 'حاکمیتی' (Sovereign AI) بسیار تشنه است. شرکت‌ها حاضرند برای کنترل کامل بر داده‌ها، حریم خصوصی و مالکیت فکری خود، حتی در استفاده از پیشرفته‌ترین مدل‌های هوش مصنوعی، هزینه بالایی بپردازند. این یک تغییر پارادایم از مدل‌های عمومی AI به سمت استقرارهای اختصاصی و امن است.";
            } else if (signal.company === "Shopify") {
                return "برای کسب‌وکارهای کوچک و متوسط (SMBs)، نوآوری در فرآیندهای مرکزی کسب‌وکار مانند توسعه و تأمین محصول حیاتی است. Shopify با دموکراتیزه کردن این فرآیندها از طریق عامل‌های هوش مصنوعی مولد، نه تنها ارزش پلتفرم خود را افزایش می‌دهد، بلکه یک جریان درآمدی جدید قوی ایجاد می‌کند و به SMBها کمک می‌کند تا در بازاری رقابتی رشد کنند. این نشان‌دهنده یک مدل موفق از همسویی ارزش است.";
            } else if (signal.company === "EcoSphere (YC S27 Batch)") {
                return "این مورد نشان می‌دهد که پایداری دیگر فقط یک هزینه نیست، بلکه می‌تواند یک موتور درآمدی قابل توجه باشد. با حل یک مشکل عملیاتی پیچیده (تبدیل زباله صنعتی به ارزش) از طریق هوش مصنوعی، EcoSphere ثابت می‌کند که می‌توان با همسویی منافع مالی و محیط زیستی، بازارهای جدید و سودآوری را ایجاد کرد. مدل قیمت‌گذاری مبتنی بر عملکرد آن، این ارزش را مستقیماً به مشتریان نشان می‌دهد.";
            }
            return signal.core_lesson; // Fallback to core lesson if no specific "Why it matters"
        }

        function generateActionForStartup(signal) {
            if (signal.company === "OpenAI") {
                return "اگر استارتاپ شما در حوزه هوش مصنوعی فعالیت می‌کند، به جای رقابت با مدل‌های عمومی، روی ارائه راه‌حل‌های 'حاکمیتی' (Sovereign) و مدیریت‌شده برای بخش‌های سازمانی با نیازهای سختگیرانه حریم خصوصی و انطباق تمرکز کنید. امنیت، کنترل داده و سفارشی‌سازی برای شرکت‌های بزرگ ارزش فوق‌العاده‌ای دارد.";
            } else if (signal.company === "Shopify") {
                return "برای پلتفرم‌های SaaS که به SMBها خدمت می‌کنند، فرصت بزرگی در ادغام عامل‌های هوش مصنوعی مولد برای خودکارسازی فرآیندهای اصلی و پیچیده (مانند تأمین، طراحی، بازاریابی) وجود دارد. یک مدل قیمت‌گذاری ترکیبی (اشتراک + کمیسیون) می‌تواند هم پذیرش را تشویق کند و هم با موفقیت کاربر همسو شود.";
            } else if (signal.company === "EcoSphere (YC S27 Batch)") {
                return "برای استارتاپ‌های Climate-tech و B2B SaaS، به دنبال مشکلات بزرگ پایداری در صنایع سنتی باشید که می‌توانند از طریق عامل‌های هوش مصنوعی به فرصت‌های درآمدی تبدیل شوند. یک مدل قیمت‌گذاری که بر اساس نتایج مالی قابل اندازه‌گیری (مانند درصد از درآمد جدید یا صرفه‌جویی در هزینه) باشد، می‌تواند پذیرش و رشد سریع را به دنبال داشته باشد.";
            }
            return "درس‌آموخته اصلی را برای صنعت خود اعمال کنید: روی حل مشکلات پرارزش با هوش مصنوعی تخصصی، قیمت‌گذاری مبتنی بر ارزش و زیرساخت‌های مقیاس‌پذیر تمرکز کنید."; // Fallback
        }
    </script>
</body>
</html>
