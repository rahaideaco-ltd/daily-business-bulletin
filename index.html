        function getStars(count) {
            return '⭐'.repeat(count);

        function generateWhyItMatters(item) {
            if (item.date === "2026-08-10") {
                if (item.company === "Shopify") {
                    return "این مورد نشان می‌دهد که پلتفرم‌های تجارت الکترونیک می‌توانند با تعمیق یکپارچگی هوش مصنوعی پیش‌بینی‌کننده و مولد در هسته عملیات تجار (مانند مدیریت موجودی، پیش‌بینی تقاضا و بازاریابی فوق‌شخصی)، جریان‌های درآمدی پریمیوم جدیدی را خلق کرده و موفقیت و چسبندگی بازرگانان را به شکل چشمگیری افزایش دهند. این یک استراتژی حیاتی برای رشد در بازارهای اشباع شده است.";
                } else if (item.company === "Uber") {
                    return "این مورد نشان می‌دهد که برای پلتفرم‌هایی که به نیروی کار انعطاف‌پذیر و گسترده متکی هستند، هوش مصنوعی فوق‌شخصی‌سازی شده در مدیریت مشارکت و انگیزه‌بخشی می‌تواند هزینه‌های عملیاتی را به شدت کاهش داده، نرخ حفظ را افزایش داده و کیفیت و پایداری سرویس را به طرز چشمگیری بهبود بخشد. این یک اهرم استراتژیک برای کارایی و مزیت رقابتی است.";
                } else if (item.company === "DataVault AI (YC S26)") {
                    return "این مورد نشان می‌دهد که سخت‌گیری فزاینده مقررات هوش مصنوعی و حریم خصوصی داده‌ها (مانند EU AI Act) یک بازار بسیار ارزشمند و روبه‌رشد برای استارتاپ‌های B2B SaaS تخصصی ایجاد می‌کند. راه‌حل‌های AI-native برای ناشناس‌سازی خودکار داده‌ها، حکمرانی و انطباق، به‌ویژه با گزینه‌های استقرار 'هوش مصنوعی حاکمیتی' (Sovereign AI)، می‌توانند به سرعت به یک عامل تمایز کلیدی و جریان درآمدی قابل توجه تبدیل شوند.";
                }
            }
            return "این مورد نشان می‌دهد که " + item.core_lesson + " این روند برای کسب‌وکارها در جهت نوآوری و حفظ مزیت رقابتی حیاتی است.";
        }

        function generateStartupAction(item) {
            if (item.date === "2026-08-10") {
                if (item.company === "Shopify") {
                    return "استارتاپ‌های فعال در حوزه تجارت الکترونیک یا ابزارهای SaaS برای SMBs باید بر شناسایی نقاط درد عملیاتی پرهزینه برای کاربران خود تمرکز کنند (مانند بهینه‌سازی زنجیره تامین یا تولید محتوای بازاریابی) و راه‌حل‌های هوش مصنوعی پیشرفته و مولد را به عنوان خدمات ارزش افزوده پریمیوم ارائه دهند. به زیرساخت‌های ابری مقیاس‌پذیر و بلادرنگ برای پشتیبانی از این حجم داده و هوش مصنوعی توجه ویژه داشته باشید.";
                } else if (item.company === "Uber") {
                    return "استارتاپ‌های فعال در اقتصاد گیگ (Gig Economy) یا پلتفرم‌هایی با نیروی کار بزرگ و توزیع شده باید بر توسعه موتورهای هوش مصنوعی برای درک رفتار فردی کاربران یا شرکای خود تمرکز کنند. ارائه مشوق‌های شخصی‌سازی شده، توصیه‌های عملیاتی و پشتیبانی پیش‌بینی‌کننده می‌تواند به شکل چشمگیری نرخ حفظ را افزایش داده، هزینه‌ها را کاهش داده و عملیات را بهینه کند. سرمایه‌گذاری در زیرساخت‌های هوش مصنوعی بلادرنگ و توزیع شده (شامل محاسبات لبه) ضروری است.";
                } else if (item.company === "DataVault AI (YC S26)") {
                    return "استارتاپ‌های B2B باید نقاط تلاقی بین چالش‌های نظارتی (مانند حریم خصوصی داده، انطباق هوش مصنوعی) و نیازهای عملیاتی کسب‌وکارها (مانند تحلیل داده‌های بزرگ، آموزش هوش مصنوعی) را شناسایی کنند. توسعه عامل‌های هوش مصنوعی تخصصی که می‌توانند این چالش‌ها را به صورت خودکار، ایمن و قابل حسابرسی حل کنند، فرصت‌های عظیمی را برای ایجاد خدمات SaaS با حاشیه سود بالا، به‌ویژه با ارائه گزینه‌های استقرار ابری حاکمیتی یا On-Premise، فراهم می‌کند.";
                }
            }
            // Generic action for historical data
            let coreLessonActionable = item.core_lesson.replace("For ", "اگر استارتاپ شما در حوزه ")
                                                   .replace("can ", "می‌تواند ")
                                                   .replace("demands ", "نیاز به ")
                                                   .replace("requires ", "نیاز به ")
                                                   .replace("creates ", "خلق می‌کند ")
                                                   .replace("becomes critical for enterprises.", "برای شرکت‌ها حیاتی می‌شود.");
            return "استارتاپ شما باید: " + coreLessonActionable + " فرصت‌های مشابهی را برای خلق ارزش از طریق هوش مصنوعی بررسی کنید. به دنبال نقاط درد شدید در بازار خود باشید و هوش مصنوعی را به عنوان یک راهکار پریمیوم یا کارآمد پیاده‌سازی کنید.";
        }

            const card = document.createElement('div');
            card.className = 'card';

            const categories = item.category.split(',').map(cat => `<span class="category-tag ${getCategoryClass(cat)}">${cat.trim().replace(/-/g, ' ')}</span>`).join('');

            card.innerHTML = `
                <div class="card-header">
                    <h2>${item.company}</h2>
                    <p><strong>تاریخ:</strong> ${item.date}</p>
                </div>
                <div class="source-info">
                    <span class="stars">${getStars(item.source_quality_stars)}</span>
                    <a href="${item.source_url}" target="_blank">${item.source_name}</a>
                </div>
                <div class="category-tags">${categories}</div>

                <div class="card-section">

                    <p>${item.experiment_or_action}</p>
                </div>
                <div class="card-section">
                    <h3>متریک رصد شده:</h3>
                    <p>${item.metric_tracked}</p>
                </div>
                <div class="card-section">
                    <h3>نتیجه تصمیم:</h3>
                    <p>${item.decision_outcome}</p>
                </div>
                <div class="card-section">
                    <h3>درس آموخته اصلی:</h3>
                    <p>${item.core_lesson}</p>
                </div>
                <div class="section-why-it-matters">
                    <h3>چرا اهمیت دارد؟</h3>
                    <p>${generateWhyItMatters(item)}</p>
                </div>
                <div class="section-startup-action">
                    <h3>اقدام امروز برای استارتاپ شما:</h3>
                    <p>${generateStartupAction(item)}</p>
                </div>
            `;
            gridContainer.appendChild(card);
        });
    </script>
