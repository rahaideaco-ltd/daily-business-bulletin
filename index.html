        function createStarRating(stars) {
            let ratingHtml = '';
            for (let i = 0; i < 5; i++) {
                ratingHtml += `<span style="${i < stars ? 'color: var(--star-color);' : 'color: #555;'}">&#9733;</span>`;
            }
            return `<div class="star-rating" aria-label="Quality rating: ${stars} out of 5 stars">${ratingHtml}</div>`;
        }

        function getCategoryTags(categoryString) {
            const categories = categoryString.split(',').map(tag => tag.trim());
            return categories.map(tag => `<span class="category-tag" data-category="${tag}">${tag}</span>`).join('');
        }

        function renderDashboard() {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = ''; // Clear existing content

            // Sort entries: Newest first
            const sortedEntries = [...allEntries].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedEntries.forEach(entry => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <div class="card-content">
                        <div class="date">
                            <span>تاریخ: ${entry.date}</span>
                            ${createStarRating(entry.source_quality_stars)}
                        </div>
                        <h2>${entry.company}</h2>
                        <div class="category-tags">${getCategoryTags(entry.category)}</div>

                        <h3>مسئله:</h3>
                        <p>${entry.problem}</p>

                        <h3>فرضیه:</h3>
                        <p>${entry.hypothesis}</p>

                        <h3>اقدام/آزمایش:</h3>
                        <p>${entry.experiment_or_action}</p>

                        <h3>متریک ردیابی شده:</h3>
                        <p>${entry.metric_tracked}</p>

                        <h3>نتیجه تصمیم:</h3>
                        <p>${entry.decision_outcome}</p>

                        <h3>درس‌آموخته اصلی:</h3>
                        <p>${entry.core_lesson}</p>

                        <div class="why-it-matters">
                            <h4>چرا اهمیت دارد؟</h4>
                            <p>${entry.why_it_matters || 'تحلیل در دست انجام است.'}</p>
                        </div>

                        <div class="action-for-startup">
                            <h4>اقدام امروز برای استارتاپ شما:</h4>
                            <p>${entry.action_for_startup || 'توصیه در دست بررسی است.'}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span class="source-info">منبع: <a href="${entry.source_url}" target="_blank" rel="noopener noreferrer">${entry.source_name}</a></span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', renderDashboard);
    </script>
</body>
